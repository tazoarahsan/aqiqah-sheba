# ─────────────────────────────────────────────
#  Aqiqah Sheba — site settings (used by the blog)
#  Existing pages (index.html, packages.html, …) are NOT changed by this file.
# ─────────────────────────────────────────────
title: আকিকাহ শেবা
description: আকিকা, নবজাতকের সুন্নাহ, সাদাকাহ ও কাফফারা নিয়ে দলিলভিত্তিক লেখা — আকিকাহ শেবা।
url: "https://aqiqahsheba.com"
baseurl: ""
lang: bn
timezone: Asia/Dhaka

# Contact details used in the blog's footer, buttons and WhatsApp float.
# Change them here once and every blog page updates.
whatsapp: "8801631010772"
phone_tel: "+8801631010772"
phone_display: "০১৯৭৩-৩৭১০১৯"
email: "hello@aqiqahsheba.com"
facebook: "https://facebook.com/aqiqahsheba"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: blog/feed.xml

# Every post gets the post layout and a /blog/<slug>/ address automatically
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:slug/
      author: আকিকাহ শেবা টিম

exclude:
  - README.md
