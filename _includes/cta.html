{%- assign _cl = page.lang | default: "bn" -%}{%- assign _ct = site.data.i18n[_cl] -%}
<aside class="cta-box">
<p class="cta-box-title">{{ _ct.cta_title }}</p>
<p class="cta-box-text">{{ _ct.cta_text }}</p>
<div class="cta-box-actions"><a href="{{ _ct.packages_url }}" class="btn btn-gold">{{ _ct.cta_packages }}</a><a href="https://wa.me/{{ site.whatsapp }}?text={{ _ct.wa_text }}" class="btn btn-ghost-light">{{ _ct.cta_ask }}</a></div>
</aside>
